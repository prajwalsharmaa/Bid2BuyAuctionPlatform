spring.application.name=Bid2BuyAuctionPlatform

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/bid2buyauction-db
spring.datasource.username=bid2buyauction
spring.datasource.password=bid2buyauction
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage Paths
file.upload.profile.dir=uploads/profile/
file.upload.citizenship.dir=uploads/citizenship/
file.upload.auction.dir=uploads/auction/

# Admin Credentials (Hardcoded)
admin.email=admin@bid2buy.com
admin.password=Admin@123

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=8080

