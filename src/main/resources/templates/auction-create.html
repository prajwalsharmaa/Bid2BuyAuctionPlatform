<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Auction - Bid2Buy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">Bid2Buy</a>
            <ul class="nav-menu">
                <li><a href="/dashboard">Dashboard</a></li>
                <li th:if="${currentUser != null and currentUser.approved}">
                    <div class="mode-toggle-nav">
                        <form th:action="@{/dashboard/toggle-buyer}" method="post" style="display: inline;">
                            <button type="submit" class="btn-nav" 
                                    th:classappend="${currentUser.buyerMode ? 'btn-nav-active' : ''}">
                                Buyer
                            </button>
                        </form>
                        <form th:action="@{/dashboard/toggle-seller}" method="post" style="display: inline;">
                            <button type="submit" class="btn-nav" 
                                    th:classappend="${currentUser.sellerMode ? 'btn-nav-active' : ''}">
                                Seller
                            </button>
                        </form>
                    </div>
                </li>
                <li>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn-logout">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="container">
            <div class="form-container">
                <h2>Create New Auction</h2>
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
                
                <form th:action="@{/auction/create}" th:object="${auctionCreateDTO}" method="post" 
                      enctype="multipart/form-data" class="form">
                    <div class="form-group">
                        <label for="productName">Product Name *</label>
                        <input type="text" id="productName" th:field="*{productName}" 
                               class="form-input" required>
                        <span th:if="${#fields.hasErrors('productName')}" 
                              th:errors="*{productName}" class="error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Product Description</label>
                        <textarea id="description" th:field="*{description}" 
                                  class="form-input" rows="5" 
                                  placeholder="Describe your product in detail (features, condition, specifications, etc.)"></textarea>
                        <span th:if="${#fields.hasErrors('description')}" 
                              th:errors="*{description}" class="error"></span>
                        <small class="form-help">Provide detailed information about your product to attract more bidders.</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="image">Product Image</label>
                        <input type="file" id="image" th:field="*{image}" 
                               accept="image/jpeg,image/png" class="form-input">
                        <span th:if="${#fields.hasErrors('image')}" 
                              th:errors="*{image}" class="error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="categoryId">Category *</label>
                        <select id="categoryId" th:field="*{categoryId}" class="form-select" required>
                            <option value="">Select Category</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat.id}" 
                                    th:text="${cat.name}"></option>
                        </select>
                        <span th:if="${#fields.hasErrors('categoryId')}" 
                              th:errors="*{categoryId}" class="error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="basePrice">Base Price *</label>
                        <input type="number" id="basePrice" th:field="*{basePrice}" 
                               step="0.01" min="0.01" class="form-input" required>
                        <span th:if="${#fields.hasErrors('basePrice')}" 
                              th:errors="*{basePrice}" class="error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="startTime">Auction Start Time *</label>
                        <input type="datetime-local" id="startTime" th:field="*{startTime}" 
                               class="form-input" required>
                        <span th:if="${#fields.hasErrors('startTime')}" 
                              th:errors="*{startTime}" class="error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="endTime">Auction End Time *</label>
                        <input type="datetime-local" id="endTime" th:field="*{endTime}" 
                               class="form-input" required>
                        <span th:if="${#fields.hasErrors('endTime')}" 
                              th:errors="*{endTime}" class="error"></span>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Create Auction</button>
                    <a href="/dashboard" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Bid2Buy. All rights reserved.</p>
        </div>
    </footer>
    
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
